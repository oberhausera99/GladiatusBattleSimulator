[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gladiatus-sim"
version = "0.1.0"
description = "Gladiatus arena and Circus Turma battle simulator"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gladiatus-sim = "gladiatus_sim.cli:main"

[tool.setuptools]
packages = ["gladiatus_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
